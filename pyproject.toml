[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bankruptcy-early-warning-screener"
version = "0.1.0"
description = "Interpretable financial-distress screening and bankruptcy-risk analytics"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Suvam Priyaranjan Sahoo" }]

[tool.setuptools]
packages = ["src"]
